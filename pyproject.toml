[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mf-ai-accounting"
version = "0.1.0"
description = "Money Forward Cloud Accounting read-only data fetcher (Phase 1)"
requires-python = ">=3.11"
dependencies = ["requests>=2.32,<3", "python-dotenv>=1.0,<2", "rapidfuzz>=3,<4", "anthropic>=1.8,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
